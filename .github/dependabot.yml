version: 2
updates:
  # Both workflows SHA-pin their actions; Dependabot bumps the pins (and keeps
  # the trailing "# vX.Y.Z" comments accurate) so pinning never means stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Runtime dependencies are pinned exactly on purpose — playwright-core
  # couples to a browser binary, and tldts carries the Public
  # Suffix List snapshot that decides a credential's base-domain scope (the
  # full rationale lives in scripts/check-versions.ts). Those bumps must be
  # deliberate, so Dependabot only proposes devDependency updates, and the
  # ignore list restates the pinned three in case the allow scope ever widens.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    ignore:
      - dependency-name: playwright-core
      - dependency-name: tldts
      - dependency-name: patchright-core
