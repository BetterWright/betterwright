# TEMPORARY — delete before merging PR #78.
#
# Runs research/windows-fs-probe.mjs on windows-latest to confirm the
# filesystem semantics the vault lock's Windows branches depend on. The
# probe's recorded-output block is filled in from this workflow's log.
name: windows-fs-probe

on:
  push:
    branches: [chore/professionalization]

permissions:
  contents: read

jobs:
  probe:
    name: Windows filesystem probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --version
      - run: node research/windows-fs-probe.mjs
