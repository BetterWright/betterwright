name: Probe Ubuntu ARM64 clang runtime

on:
  push:
    branches:
      - "build/betterchromium-linux-arm64"
    paths:
      - ".github/workflows/probe-ubuntu-arm64-clang.yml"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.ref == 'refs/heads/build/betterchromium-linux-arm64' &&
      github.actor == 'CuriosityOS'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 5
    steps:
      - name: Inspect native clang runtime layout
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld
          clang --version
          clang -print-target-triple
          resource_dir=$(clang -print-resource-dir)
          runtime=$(clang --rtlib=compiler-rt --print-libgcc-file-name)
          printf 'resource_dir=%s\nruntime=%s\n' "$resource_dir" "$runtime"
          test -d "$resource_dir"
          find "$resource_dir/lib" -maxdepth 3 -type f -name 'libclang_rt.builtins*.a' -print
          test -f "$runtime"
