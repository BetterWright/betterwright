name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-integrity:
    # Keep this display name stable because main branch protection requires it.
    name: Worker copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:types
      - run: npm run check:package

  node:
    # Keep this display name stable because main branch protection requires it.
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install deterministic Chromium test backend
        run: node node_modules/playwright-core/cli.js install chromium --no-shell
      # The broad suite selects explicit Chromium; Cloak has a separate opt-in E2E.
      # REQUIRE_BROWSER turns the suite's local-dev skip into a CI failure, so a
      # broken Chromium install can never report green by skipping every test.
      - run: npm test
        env:
          BETTERWRIGHT_REQUIRE_BROWSER: "1"
