name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-sync:
    name: Worker copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sync-worker.mjs --check

  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Install deterministic Chromium test backend
        run: node bin/betterwright.mjs setup --chromium
      - run: npm run lint
      # The broad suite uses explicit Chromium; Cloak has a separate opt-in E2E.
      - run: npm test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: pip install -e '.[dev]'
      - name: Install browser runtime
        run: betterwright setup --chromium
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Test
        working-directory: python
        run: pytest -q
