name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-integrity:
    # Keep this display name stable because main branch protection requires it.
    name: Worker copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:worker
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:types
      - run: npm run check:package

  node:
    # Keep this display name stable because main branch protection requires it.
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install deterministic Chromium test backend
        run: node node_modules/playwright-core/cli.js install chromium --no-shell
      # The broad suite selects explicit Chromium; Cloak has a separate opt-in E2E.
      - run: npm test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: python
        run: pip install -e '.[dev]'
      - name: Install browser runtime
        run: betterwright setup --chromium
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Test
        working-directory: python
        run: pytest -q
