name: Publish npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    name: Publish trusted package
    runs-on: ubuntu-latest
    environment: npm
    # Downloads two browsers and runs the full integration suite before it
    # publishes. Generous, but bounded: a hung browser launch should fail the
    # release rather than hold the npm environment open for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      # Must equal the pin in ci.yml's branch-protected jobs. This used to be
      # 22.14.0 while CI floated "22", so the artifact that actually reached
      # npm was the one build nothing had tested. 22.18.0 is the package's
      # engines floor (Node's type stripping, which the shipped
      # examples/typescript/ run on, needs >= 22.18) and satisfies npm 11's own
      # >= 22.9.0 requirement below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install Trusted Publishing capable npm
        run: npm install --global npm@11.5.1
      # The release scripts are TypeScript, so dependencies (tsc) must be in
      # place before the tag can be verified. This install is unconditional for
      # that reason; every later step still short-circuits on an existing
      # published version.
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify release source and tag
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          npm run build:tools
          node scripts/check-versions.js --tag "${{ github.event.release.tag_name }}"
      - name: Check whether this version already exists
        id: existing
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build TypeScript sources
        if: steps.existing.outputs.published != 'true'
        run: npm run build
      # The published default is Obscura with Cloak as its compatibility
      # renderer. Install both so a release cannot reach npm after testing only
      # the fallback backend.
      - name: Install managed browsers
        if: steps.existing.outputs.published != 'true'
        run: node dist/bin/betterwright.js setup
      - name: Verify Chromium fork update
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          HOME=$(mktemp -d)
          export HOME
          node dist/bin/betterwright.js update
          node -e "
            import { resolveChromiumForkBinary } from './dist/src/chromium-fork.js';
            const binary = resolveChromiumForkBinary({ home: process.env.HOME });
            if (!binary) throw new Error('update did not install a discoverable fork');
            console.log('fork ok:', binary);
          "
      - name: Run browser integration suite
        if: steps.existing.outputs.published != 'true'
        run: npm test
        env:
          BETTERWRIGHT_REQUIRE_BROWSER: "1"
          # Keep integration/Cloak e2e on Cloak even if a fork exists on the runner.
          BETTERWRIGHT_CHROMIUM_ROOT: "off"
      - name: Test managed CloakBrowser headed mode
        if: steps.existing.outputs.published != 'true'
        run: xvfb-run -a env BETTERWRIGHT_CLOAK_E2E=1 BETTERWRIGHT_CHROMIUM_ROOT=off node --test tests/node/cloak.test.js
      - name: Select npm distribution tag
        if: steps.existing.outputs.published != 'true'
        id: npm_tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            if [[ "${{ github.event.release.prerelease }}" != "true" ]]; then
              echo "Prerelease package versions must use a GitHub prerelease." >&2
              exit 1
            fi
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "Stable package versions cannot use a GitHub prerelease." >&2
              exit 1
            fi
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.existing.outputs.published != 'true'
        run: npm publish --access public --tag "${{ steps.npm_tag.outputs.tag }}"
