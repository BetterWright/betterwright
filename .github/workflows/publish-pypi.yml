name: Publish PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish trusted package
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify release source and tag
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          node scripts/check-versions.mjs --tag "${{ github.event.release.tag_name }}"
      - name: Check whether this version already exists
        id: existing
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          if curl --fail --silent "https://pypi.org/pypi/betterwright/$VERSION/json" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "betterwright $VERSION is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install package with dev extras
        if: steps.existing.outputs.published != 'true'
        working-directory: python
        run: pip install -e '.[dev]' build
      - name: Install browser runtime
        if: steps.existing.outputs.published != 'true'
        run: betterwright setup --chromium
      - name: Lint
        if: steps.existing.outputs.published != 'true'
        working-directory: python
        run: ruff check .
      - name: Run Python test suite
        if: steps.existing.outputs.published != 'true'
        working-directory: python
        run: pytest -q
      - name: Build sdist and wheel
        if: steps.existing.outputs.published != 'true'
        working-directory: python
        run: python -m build
      - name: Publish to PyPI with trusted publishing
        if: steps.existing.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: python/dist
