name: Probe Ubuntu ARM64 Clang 24

on:
  push:
    branches:
      - "build/betterchromium-linux-arm64"
    paths:
      - ".github/workflows/probe-ubuntu-arm64-clang24.yml"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.ref == 'refs/heads/build/betterchromium-linux-arm64' &&
      github.actor == 'CuriosityOS'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 5
    steps:
      - name: Verify Clang 24 and Chromium flags
        shell: bash
        run: |
          set -euxo pipefail
          key=/tmp/apt.llvm.org.asc
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | \
            awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = '6084F3CF814B57C1CF12EFD515CF4D18AF4F7421'
          sudo install -m 0644 "$key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo 'deb [arch=arm64] https://apt.llvm.org/jammy/ llvm-toolchain-jammy main' | \
            sudo tee /etc/apt/sources.list.d/apt-llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-24 lld-24 libclang-rt-24-dev
          clang-24 --version
          ld.lld-24 --version
          clang-24 -print-target-triple
          resource_dir=$(clang-24 -print-resource-dir)
          runtime=$(clang-24 --rtlib=compiler-rt --print-libgcc-file-name)
          printf 'resource_dir=%s\nruntime=%s\n' "$resource_dir" "$runtime"
          test -f "$resource_dir/include/module.modulemap"
          test -f "$runtime"
          printf 'int main() { return 0; }\n' | clang++-24 \
            -x c++ -std=c++26 -c -o /tmp/probe.o - \
            --warning-suppression-mappings=/dev/null \
            -fdiagnostics-show-inlining-chain \
            -fno-lifetime-dse \
            -fsanitize=array-bounds,return \
            -fsanitize-ignore-for-ubsan-feature=array-bounds \
            -fsanitize-ignore-for-ubsan-feature=return
          file /tmp/probe.o
