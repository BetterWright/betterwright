name: WarpBuild runner probe

on:
  push:
    branches:
      - "build/betterchromium-linux-arm64"
    paths:
      - ".github/workflows/warpbuild-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == 'CuriosityOS'
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 3
    steps:
      - name: Confirm managed runner
        run: |
          echo "WarpBuild app reinstalled and runner group bound"
          uname -a
          nproc
          df -h /
